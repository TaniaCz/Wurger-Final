# --- CONFIGURACIÓN DEL PUERTO (Para Render) ---
server.port=${PORT:8080}

# --- CONEXIÓN A BASE DE DATOS ---
# Usa variables de entorno (DB_URL, DB_USER, DB_PASS) si existen, si no, usa localhost
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Wurger?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# --- TUS CREDENCIALES (CÁMBIALAS) ---
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:Milo1028.}

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CONFIGURACIÓN DE HIBERNATE (JPA) ---
# 'update': Actualiza la estructura si agregas campos nuevos, pero NO borra tus datos.
# 'validate': Solo revisa que la BD coincida con Java (bueno para producción).
spring.jpa.hibernate.ddl-auto=update

# Dialecto para que hable bien con MySQL 8 o superior
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- VISUALIZACIÓN (Opcional) ---
# Muestra las consultas SQL en la consola (útil para ver qué hace tu app)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- CONFIGURACIÓN DE CORREO ---
# En Render, agregar: MAIL_USERNAME=tu@gmail.com  y  MAIL_PASSWORD=tu_app_password_sin_espacios
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nanancz08@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mxmpqqkfcsjvxldp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
